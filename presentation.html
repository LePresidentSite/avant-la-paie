  .footer-brand {
    font-family: 'Fraunces', Georgia, serif;
    color: var(--ink);
    font-size: clamp(28px, 3vw, 40px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .footer-brand span {
    color: #FBBF24;
  }
  .footer-slogan {
    margin: 14px 0 20px;
    color: rgba(203,213,225,0.86);
    font-size: 15px;
    line-height: 1.55;
  }
  .trust-badges {
    display: grid;
    gap: 10px;
  }
  .trust-badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 999px;
    color: rgba(248,250,252,0.92);
    font-size: 13px;
    font-weight: 800;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.11);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .trust-badge::before {
    content: "✓";
    display: inline-grid;
    place-items: center;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    color: #DBEAFE;
    background: rgba(96,165,250,0.20);
    border: 1px solid rgba(147,197,253,0.28);
  }
  .footer-heading {
    margin: 4px 0 16px;
    color: var(--ink);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .footer-links,
  .footer-proof-list {
    display: grid;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .footer-links a {
    color: rgba(203,213,225,0.90);
    text-decoration: none;
    font-size: 15px;
    font-weight: 800;
    transition: color 0.18s ease, transform 0.18s ease;
  }
  .footer-links a:hover {
    color: #F8FAFC;
    transform: translateX(3px);
  }
  .footer-trust-card {
    height: 100%;
    padding: 22px;
    border-radius: 24px;
    color: rgba(203,213,225,0.90);
    line-height: 1.62;
    background:
      linear-gradient(145deg, rgba(96,165,250,0.14), rgba(255,255,255,0.035)),
      rgba(15,23,42,0.68);
    border: 1px solid rgba(147,197,253,0.18);
    box-shadow:
      0 28px 84px rgba(37,99,235,0.12),
      inset 0 1px 0 rgba(255,255,255,0.09);
    backdrop-filter: blur(18px);
  }
  .footer-trust-card h3 {
    margin: 0 0 10px;
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    font-size: 24px;
    line-height: 1.1;
  }
  .footer-trust-card p {
    margin: 0;
    font-size: 15px;
  }
  .footer-proof-list li {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    color: rgba(203,213,225,0.92);
    font-size: 15px;
    font-weight: 750;
    line-height: 1.45;
  }
  .footer-bottom {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 14px;
    margin-top: clamp(28px, 4vw, 44px);
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,0.10);
    color: rgba(203,213,225,0.70);
    font-size: 13px;
    font-weight: 750;
  }
  .footer-bottom a {
    color: rgba(203,213,225,0.76);
    text-decoration: none;
  }
  .footer-bottom a:hover {
    color: #F8FAFC;
  }

  @media (max-width: 980px) {
    .footer-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 640px) {
    .site-footer {
      padding-inline: 16px;
    }
    .footer-grid {
      grid-template-columns: 1fr;
    }
    .footer-trust-card {
      padding: 20px;
    }
    .footer-bottom {
      display: grid;
      justify-content: stretch;
    }
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(2deg); }
    50% { transform: translateY(-12px) rotate(1deg); }
  }
  @keyframes softPulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
  @media (max-width: 900px) {
    .nav-link { display: none; }
    .hero {
      grid-template-columns: 1fr;
      padding-top: 52px;
      padding-bottom: 48px;
    }
    .hero-visual {
      min-height: 520px;
    }
    .floating-card.one { left: 8px; top: 28px; }
    .floating-card.two { right: 8px; bottom: 44px; }
    .feature-grid,
    .steps,
    .story-layout,
    .price-grid {
      grid-template-columns: 1fr;
    }
    section {
      padding-top: 58px;
      padding-bottom: 58px;
    }
  }
  @media (max-width: 520px) {
    .nav { padding-inline: 14px; }
    .brand span { display: none; }
    .hero { padding-inline: 16px; }
    section { padding-inline: 16px; }
    .hero-actions { flex-direction: column; }
    .btn { width: 100%; }
    .phone {
      width: min(318px, 88vw);
    }
    .floating-card {
      font-size: 13px;
      padding: 11px 13px;
    }
  }

  :root {
    --bg: #0F172A;
    --card: rgba(15, 23, 42, 0.66);
    --ink: #F8FAFC;
    --muted: #CBD5E1;
    --soft: rgba(96, 165, 250, 0.14);
    --accent: #2563EB;
    --accent-2: #60A5FA;
    --accent-soft: rgba(96, 165, 250, 0.18);
    --warm: #FBBF24;
    --mint: #93C5FD;
    --coral: #FBBF24;
    --line: rgba(255,255,255,0.12);
    --shadow: 0 28px 90px rgba(2, 6, 23, 0.42);
    --shadow-soft: 0 18px 55px rgba(2, 6, 23, 0.30);
    --radius: 28px;
  }

  body {
    background:
      radial-gradient(820px 520px at 12% 0%, rgba(37,99,235,0.34), transparent 68%),
      radial-gradient(720px 460px at 88% 18%, rgba(96,165,250,0.22), transparent 66%),
      linear-gradient(145deg, #0F172A 0%, #111A35 42%, #07111F 100%);
    color: var(--ink);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.045), transparent 34%),
      radial-gradient(circle at 50% 0%, rgba(96,165,250,0.10), transparent 42%);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: 0.22;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: linear-gradient(to bottom, black, transparent 70%);
  }

  .nav {
    background: rgba(15,23,42,0.72);
    border-bottom: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 12px 42px rgba(2,6,23,0.20);
  }

  .brand {
    color: var(--ink);
  }

  .brand img {
    box-shadow: 0 0 28px rgba(96,165,250,0.22);
  }

  .brand span span {
    color: var(--accent-2);
  }

  .nav-link {
    color: rgba(203,213,225,0.82);
  }

  .nav-link:hover {
    color: #fff;
  }

  .nav-cta,
  .btn.primary {
    background: linear-gradient(135deg, #60A5FA, #2563EB);
    color: #FFFFFF;
    box-shadow: 0 18px 40px rgba(37,99,235,0.34);
  }

  .btn.secondary {
    background: rgba(255,255,255,0.08);
    color: var(--ink);
    border-color: rgba(255,255,255,0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
  }

  .nav-cta:hover,
  .btn:hover {
    box-shadow: 0 22px 48px rgba(37,99,235,0.42);
  }

    max-width: 1320px;
    margin: 34px auto 0;
    border-radius: 48px;
    border: 1px solid rgba(255,255,255,0.12);

      linear-gradient(135deg, rgba(30,58,138,0.78), rgba(15,23,42,0.92) 54%, rgba(6,13,28,0.96));
    box-shadow: 0 42px 110px rgba(2,6,23,0.44);
    overflow: hidden;
  }

    background:
      linear-gradient(110deg, rgba(255,255,255,0.09), transparent 32%),
      radial-gradient(circle at 85% 12%, rgba(96,165,250,0.20), transparent 28%);
  }
