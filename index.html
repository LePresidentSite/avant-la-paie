<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0e17">
<title>Avant la Paie</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0e17;
    --surface: #1a1925;
    --surface-2: #252434;
    --ink: #fffffe;
    --ink-soft: #a7a9be;
    --accent: #ff8906;
    --accent-2: #f25f4c;
    --good: #2cb67d;
    --warn: #e53170;
    --line: rgba(255,255,254,0.08);
    --radius: 18px;
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(255,137,6,0.12), transparent 60%),
      radial-gradient(900px 500px at -10% 100%, rgba(242,95,76,0.10), transparent 60%),
      var(--bg);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .logo {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.02em;
    font-style: italic;
  }
  .logo span { color: var(--accent); }

  .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* SECTION TITRES */
  .section-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 22px 4px 12px;
  }
  .section-title h2 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .section-title span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* CARTE DE TOTAL REVENUS */
  .total-revenus {
    background: linear-gradient(140deg, rgba(44,182,125,0.12), var(--surface));
    border: 1px solid rgba(44,182,125,0.25);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .total-revenus::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(44,182,125,0.18), transparent 70%);
    pointer-events: none;
  }
  .total-revenus .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .total-revenus .amount {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-style: italic;
    color: var(--good);
  }
  .total-revenus .countdown {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .total-revenus .countdown b { color: var(--good); font-size: 14px; }

  /* CARTE D'ITEM (revenu ou enveloppe) */
  .item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform 0.15s, border-color 0.2s;
    margin-bottom: 8px;
  }
  .item.received { border-color: rgba(44,182,125,0.35); }
  .item.allocated { border-color: rgba(44,182,125,0.35); }
  .item:active { transform: scale(0.98); }

  .item-emoji {
    font-size: 22px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,254,0.04);
    border-radius: 10px;
    flex-shrink: 0;
  }

  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .item-amount .when {
    color: var(--accent);
    margin-left: 6px;
  }
  .item-amount strong.green { color: var(--good); font-size: 13px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }

  .item-actions { display: flex; gap: 6px; }

  .icon-btn {
    background: rgba(255,255,254,0.05);
    border: none;
    color: var(--ink);
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s;
  }
  .icon-btn:active { background: rgba(255,255,254,0.12); }
  .icon-btn.check.on {
    background: var(--good);
    color: var(--bg);
  }

  /* RESTE À ALLOUER - le HÉROS visuel */
  .remaining {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 22px;
    margin: 18px 0 6px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .remaining .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .remaining .amount {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    font-style: italic;
    transition: color 0.3s;
  }

  .remaining .amount.good { color: var(--good); }
  .remaining .amount.warn { color: var(--accent); }
  .remaining .amount.over { color: var(--warn); }

  .remaining .sub {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .progress-bar {
    height: 6px;
    background: rgba(255,255,254,0.06);
    border-radius: 999px;
    margin-top: 16px;
    overflow: hidden;
  }
  .progress-bar div {
    height: 100%;
    background: linear-gradient(90deg, var(--good), var(--accent));
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  /* BOUTONS AJOUTER (par section) */
  .add-inline {
    width: 100%;
    background: rgba(255,255,254,0.04);
    border: 1px dashed var(--line);
    color: var(--ink-soft);
    padding: 12px;
    border-radius: 12px;
    font-family: 'Fraunces', serif;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
    transition: all 0.15s;
  }
  .add-inline:active { background: rgba(255,255,254,0.08); color: var(--ink); }
  .add-inline.green { border-color: rgba(44,182,125,0.3); }
  .add-inline.green:active { background: rgba(44,182,125,0.1); color: var(--good); }
  .add-inline.orange { border-color: rgba(255,137,6,0.3); }
  .add-inline.orange:active { background: rgba(255,137,6,0.1); color: var(--accent); }

  /* MODAL */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    display: none;
    align-items: flex-end;
    z-index: 100;
    animation: fade 0.2s ease;
  }
  .modal-bg.show { display: flex; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
    animation: up 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    max-height: 92vh;
    overflow-y: auto;
  }
  @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal h3 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 18px;
    font-style: italic;
  }
  .modal h3 .badge {
    font-size: 11px;
    background: rgba(255,137,6,0.15);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
    font-style: normal;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .modal h3 .badge.green { background: rgba(44,182,125,0.15); color: var(--good); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row > .field { flex: 1; margin-bottom: 14px; }

  input[type="number"], input[type="date"], input[type="text"] {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
    min-height: 48px;
  }
  input[type="date"] {
    display: block;
    cursor: pointer;
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    opacity: 0.6;
    cursor: pointer;
  }
  input[type="date"]::-webkit-date-and-time-value {
    text-align: left;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: var(--ink-soft); opacity: 0.5; }

  .emoji-pick {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .emoji-pick button {
    background: rgba(255,255,254,0.05);
    border: 2px solid transparent;
    border-radius: 10px;
    width: 42px; height: 42px;
    font-size: 22px;
    cursor: pointer;
  }
  .emoji-pick button.sel {
    border-color: var(--accent);
    background: rgba(255,137,6,0.12);
  }
  .emoji-pick button.sel.green {
    border-color: var(--good);
    background: rgba(44,182,125,0.12);
  }

  .modal-actions {
    display: flex; gap: 10px; margin-top: 22px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary.green { background: var(--good); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-danger { background: rgba(229,49,112,0.15); color: var(--warn); }

  /* PRESETS */
  .presets {
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .presets-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-chip {
    background: rgba(255,255,254,0.05);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-family: 'Fraunces', serif;
    cursor: pointer;
  }
  .preset-chip:active { background: rgba(255,137,6,0.15); }

  .reset-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: var(--ink-soft);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* CALENDRIER CUSTOM */
  .date-trigger {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-trigger.empty { color: var(--ink-soft); opacity: 0.5; }
  .date-trigger:active { border-color: var(--accent); }
  .date-trigger .cal-icon { font-size: 18px; }

  .cal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
    animation: fade 0.2s ease;
  }
  .cal-overlay.show { display: flex; }

  .cal-popup {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 360px;
    animation: pop 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-title {
    font-size: 18px;
    font-weight: 700;
    font-style: italic;
    text-transform: capitalize;
  }
  .cal-nav {
    display: flex;
    gap: 6px;
  }
  .cal-nav button {
    background: rgba(255,255,254,0.06);
    border: none;
    color: var(--ink);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-nav button:active { background: rgba(255,255,254,0.14); }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .cal-weekdays div {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 0;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink);
    border-radius: 10px;
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .cal-day:hover { background: rgba(255,255,254,0.05); }
  .cal-day:active { transform: scale(0.92); }
  .cal-day.other { color: var(--ink-soft); opacity: 0.3; }
  .cal-day.today {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .cal-day.selected {
    background: var(--accent);
    color: var(--bg);
    font-weight: 700;
  }
  .cal-day.selected.today { border-color: var(--accent); }

  .cal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .cal-actions button {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 10px;
    font-family: 'Fraunces', serif;
    font-size: 13px;
    cursor: pointer;
  }
  .cal-actions button:active { background: rgba(255,255,254,0.06); color: var(--ink); }
  .cal-actions button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="logo">avant<span>.</span>la paie</div>
    <div class="date" id="todayDate"></div>
  </header>

  <!-- SECTION REVENUS -->
  <div class="section-title">
    <h2>Mes revenus</h2>
    <span id="revenusCount">0 / 0 reçus</span>
  </div>

  <div class="total-revenus" id="totalRevenusBox" style="display:none;">
    <div class="label">Total prévu</div>
    <div class="amount" id="totalRevenusAmount">0 $</div>
    <div class="countdown" id="countdown"></div>
  </div>

  <div id="revenusList"></div>

  <button class="add-inline green" id="addRevenuBtn">+ Ajouter une source de revenu</button>

  <!-- RESTE À ALLOUER -->
  <div class="remaining">
    <div class="label">Reste à allouer</div>
    <div class="amount" id="remainingAmount">0 $</div>
    <div class="sub" id="remainingSub">Commence par ajouter tes revenus ci-dessus</div>
    <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- ENVELOPPES -->
  <div class="section-title">
    <h2>Mes enveloppes</h2>
    <span id="envCount">0 / 0 déposées</span>
  </div>

  <div id="envelopesList"></div>

  <button class="add-inline orange" id="addEnvBtn">+ Ajouter une enveloppe de dépense</button>

  <a class="reset-link" id="resetBtn">Tout réinitialiser</a>

</div>

<!-- Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Nouveau</h3>

    <div class="field">
      <label>Icône</label>
      <div class="emoji-pick" id="emojiPick"></div>
    </div>

    <div class="field">
      <label id="nameLabel">Nom</label>
      <input type="text" id="itemName" placeholder="ex. Paie principale">
    </div>

    <div class="field-row">
      <div class="field">
        <label id="amountLabel">Montant</label>
        <input type="number" id="itemAmount" placeholder="0" inputmode="decimal" step="0.01">
      </div>
      <div class="field" id="dateField">
        <label>Date prévue</label>
        <button type="button" class="date-trigger empty" id="itemDateBtn">
          <span class="cal-icon">📅</span>
          <span id="itemDateLabel">Choisir une date</span>
        </button>
        <input type="hidden" id="itemDate">
      </div>
    </div>

    <div class="presets">
      <div class="presets-label" id="presetsLabel">Suggestions rapides</div>
      <div class="preset-row" id="presetRow"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">Annuler</button>
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">Supprimer</button>
      <button class="btn btn-primary" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Calendrier custom -->
<div class="cal-overlay" id="calOverlay">
  <div class="cal-popup">
    <div class="cal-header">
      <div class="cal-title" id="calTitle">Mai 2026</div>
      <div class="cal-nav">
        <button id="calPrev" aria-label="Mois précédent">◄</button>
        <button id="calNext" aria-label="Mois suivant">►</button>
      </div>
    </div>
    <div class="cal-weekdays">
      <div>Lu</div><div>Ma</div><div>Me</div><div>Je</div><div>Ve</div><div>Sa</div><div>Di</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-actions">
      <button id="calToday">Aujourd'hui</button>
      <button id="calClear">Effacer</button>
      <button id="calClose" class="primary">Fermer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
